
<!DOCTYPE html>
<html>
<head>
    <title>Personal Details Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
        }

        .main {
            background-color: #4169f5;
            padding: 30px;
            margin: 10px;
        }

        .container {
            background-color: white;
            width: 65%;
            margin: auto;
            padding: 20px;
            border-radius: 5px;
        }

        h2 {
            font-size: 22px;
            margin-top: 0;
            border-bottom: 2px solid #eee;
            padding-bottom: 8px;
        }

        h4 {
            color: gray;
            margin-bottom: 15px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        label {
            font-size: 14px;
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            background-color: #4169f5;
            color: white;
            padding: 12px 40px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #244bd1;
        }
    </style>
</head>

<body>

<div class="main">

    <div class="container">

        <h2>Registration</h2>

        <h4>Personal Details</h4>

        <form>

            <div class="row">
                <div>
                    <label>Full Name</label>
                    <input type="text" placeholder="Enter your name">
                </div>

                <div>
                    <label>Date of Birth</label>
                    <input type="date">
                </div>

                <div>
                    <label>Email</label>
                    <input type="email" placeholder="Enter your email">
                </div>
            </div>

            <div class="row">
                <div>
                    <label>Mobile number</label>
                    <input type="tel" placeholder="Enter mobile number">
                </div>

                <div>
                    <label>Gender</label>
                    <input type="text" placeholder="Enter your gender">
                </div>

                <div>
                    <label>Occupation</label>
                    <input type="text" placeholder="Enter occupation">
                </div>
            </div>

            <h4>Identity Details</h4>

            <div class="row">
                <div>
                    <label>ID Type</label>
                    <input type="text" placeholder="Enter ID type">
                </div>

                <div>
                    <label>ID Number</label>
                    <input type="text" placeholder="Enter ID number">
                </div>

                <div>
                    <label>Issue Authority</label>
                    <input type="text" placeholder="Enter issue department">
                </div>
            </div>

            <div class="row">
                <div>
                    <label>Issue Date</label>
                    <input type="date">
                </div>

                <div>
                    <label>Issue State</label>
                    <input type="text" placeholder="Enter ID issue state">
                </div>

                <div>
                    <label>Expiry Date</label>
                    <input type="date">
                </div>
            </div>

            <button type="submit">Next →</button>

        </form>

    </div>

</div>

</body>
</html>
